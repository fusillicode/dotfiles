[workspace]
resolver = "2"
members = [
    "crates/agg",
    "crates/catl",
    "crates/evoke",
    "crates/fkr",
    "crates/frs",
    "crates/gbm",
    "crates/gch",
    "crates/gcu",
    "crates/ghl",
    "crates/idt",
    "crates/miskatonic",
    "crates/muxr/cli",
    "crates/muxr/client",
    "crates/muxr/config",
    "crates/muxr/core",
    "crates/muxr/server",
    "crates/muxr/transport",
    "crates/nomicon",
    "crates/nvrim",
    "crates/oe",
    "crates/rmr",
    "crates/strgci",
    "crates/tec",
    "crates/try",
    "crates/vpg",
    "crates/yghfl",
    "crates/yhfp",
    # Utility libraries (ytil)
    "crates/ytil/agents",
    "crates/ytil/cmd",
    "crates/ytil/editor",
    "crates/ytil/ext",
    "crates/ytil/gh",
    "crates/ytil/git",
    "crates/ytil/hx",
    "crates/ytil/macros",
    "crates/ytil/noxi",
    "crates/ytil/sys",
    "crates/ytil/tui",
    "crates/ytil/wezterm",
    "crates/ytil/zellij",
]

[workspace.package]
version = "0.1.0"
authors = ["Gian Lu"]
edition = "2024"
license = "MIT"
repository = "https://github.com/fusillicode/dotfiles"
readme = "README.md"
keywords = ["cli", "tools", "development", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Centralized shared dependencies (including those used only as dev-deps in member crates).
# Member crates reference them with `{ workspace = true }` under their own [dev-dependencies].
bytes = { version = "1.11" }
convert_case = { version = "0.11" }
fake = { version = "5.1", features = ["derive"] }
git2 = { version = "0.21", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["serde", "std", "tz-system", "tzdb-zoneinfo"] }
muxr_config = { package = "muxr-config", path = "./crates/muxr/config" }
muxr_core = { package = "muxr-core", path = "./crates/muxr/core" }
muxr_transport = { package = "muxr-transport", path = "./crates/muxr/transport" }
nomicon = { path = "./crates/nomicon" }
nvim-oxi = { path = "../third_party/nvim-oxi", features = ["neovim-nightly", "mlua"] }
owo-colors = { version = "4" }
rootcause = { version = "0.13" }
rstest = { version = "0.26" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3.25" }
test-that = { version = "0.5", default-features = false, features = ["std"] }
thiserror = { version = "2.0" }
tokio = { version = "1.48", default-features = false, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = { version = "2.5" }

ytil_agents = { path = "./crates/ytil/agents" }
ytil_cmd = { path = "./crates/ytil/cmd" }
ytil_editor = { path = "./crates/ytil/editor" }
ytil_ext = { path = "./crates/ytil/ext" }
ytil_gh = { path = "./crates/ytil/gh" }
ytil_git = { path = "./crates/ytil/git" }
ytil_hx = { path = "./crates/ytil/hx" }
ytil_macros = { path = "./crates/ytil/macros" }
ytil_noxi = { path = "./crates/ytil/noxi" }
ytil_sys = { path = "./crates/ytil/sys" }
ytil_tui = { path = "./crates/ytil/tui" }
ytil_wezterm = { path = "./crates/ytil/wezterm" }
ytil_zellij = { path = "./crates/ytil/zellij" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
rc_mutex = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arbitrary_source_item_ordering = "deny"
implicit_clone = "deny"
redundant_else = "deny"
single_match = "deny"
wildcard_enum_match_arm = "deny"
rc_buffer = "deny"
vec_init_then_push = "deny"
format_push_string = "deny"
verbose_file_reads = "deny"
if_then_some_else_none = "deny"
unseparated_literal_suffix = "deny"
must_use_candidate = "allow"
multiple_crate_versions = "allow"

[workspace.lints.rust]
warnings = "deny"

[profile.dev]
incremental = true

[profile.test]
# Enable debug symbols for coverage (required by llvm-cov / tarpaulin)
debug = true

[profile.release]
# Reduces the size of the target directory
strip = true
lto = true
codegen-units = 1
# This is required to avoid "nvrim" exposed functions to explode Lua
panic = "unwind"
