[package]
name = "muxr-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "muxr terminal multiplexer session server."
keywords = ["muxr", "terminal", "multiplexer", "server", "session"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
jiff = { workspace = true }
kanal = { version = "0.1", default-features = false }
libproc = { version = "0.14" }
muxr_config = { workspace = true }
muxr_core = { workspace = true }
muxr_transport = { workspace = true }
parking_lot = { version = "0.12" }
portable-pty = { version = "0.9" }
rio-vt = { version = "0.5", default-features = false }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { version = "1.15" }
tokio = { workspace = true }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-panic = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
url = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
test-that = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
